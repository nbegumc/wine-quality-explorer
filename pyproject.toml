[project]
name = "wine-quality-explorer"
version = "1.0.0"
description = "Reproducible Bayesian-network analysis of red wine quality."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.2.3",
    "scikit-learn==1.8.0",
    "pyagrum==3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wine_quality"]
